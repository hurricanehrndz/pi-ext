repos:
  - repo: local
    hooks:
      - id: treefmt
        name: treefmt
        entry: mise exec -- treefmt
        language: system
        files: \.md$
        require_serial: true
      - id: markdownlint
        name: markdownlint
        entry: mise exec -- bun x markdownlint --config .markdownlint.jsonc
        language: system
        files: \.md$
        exclude: ^prompts/
        require_serial: true
      # Prompt templates begin with executable instructions rather than titles.
      - id: markdownlint-prompts
        name: markdownlint prompt templates
        entry: mise exec -- bun x markdownlint --config .markdownlint.jsonc --disable MD041 --
        language: system
        files: ^prompts/.*\.md$
        require_serial: true
      - id: mypy-skill-scripts
        name: mypy skill Python scripts
        entry: mise run typecheck:python
        language: system
        pass_filenames: false
        files: ^(skills/web/scripts/web|pyproject\.toml|uv\.lock|mise\.toml|treefmt\.toml|\.pre-commit-config\.yaml)$
