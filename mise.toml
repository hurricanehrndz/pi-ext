[settings]
locked = true

[tools]
bun = "1.3.13"
python = "3.14.7"
uv = "0.11.21"
"aqua:numtide/treefmt" = "2.5.0"
"aqua:j178/prek" = "0.4.12"

[tasks.setup]
description = "Install dependencies from the Bun and uv lockfiles"
run = ["bun install --registry https://registry.npmjs.org --frozen-lockfile", "uv sync --python 3.14.7 --locked"]

[tasks.fmt]
description = "Format configured files with treefmt"
run = "treefmt"

[tasks."typecheck:python"]
description = "Type-check Python sources with mypy"
run = "uv run mypy"

[tasks."typecheck:typescript"]
description = "Type-check TypeScript sources with tsc"
run = "bun x tsc --noEmit"

[tasks.typecheck]
description = "Type-check everything (Python + TypeScript)"
depends = ["typecheck:python", "typecheck:typescript"]

[tasks."skills:validate"]
description = "Validate Agent Skills metadata and configured scope"
run = "bun scripts/agent-toolkit.ts validate"

[tasks."test:python"]
description = "Run web helper Python unit tests"
run = "uv run python -m unittest discover -s skills/web/scripts -p '*_test.py'"

[tasks.test]
description = "Run the test suite"
depends = ["test:python"]
run = "bun test --pass-with-no-tests"

[tasks.check]
description = "Full check: prek all-files + TypeScript typecheck + tests"
depends = ["typecheck:typescript", "skills:validate", "test"]
run = "prek run --all-files"

[tasks."hooks:install"]
description = "Install pre-commit hooks (separate from setup/check)"
run = "prek install --force --prepare-hooks"
